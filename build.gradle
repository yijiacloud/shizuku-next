plugins {
    id("idea")
}

idea.module {
    excludeDirs += file('out')
}

subprojects {
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
    plugins.withId("com.android.base") {
        android {
            compileSdk = 36
            buildToolsVersion = "36.0.0"
            ndkVersion = "29.0.13113456"
            defaultConfig {
                minSdk = 24
                targetSdk = 36
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_21
                targetCompatibility = JavaVersion.VERSION_21
            }
        }
    }
    plugins.withId('org.jetbrains.kotlin.android') {
        android.kotlinOptions {
            jvmTarget = '21'
        }
    }
}

apply from: 'api/manifest.gradle'
def gitCommitId = 'git rev-parse --short HEAD'.execute([], project.rootDir).text.trim()
def gitCommitIdSafe = gitCommitId.isEmpty() ? 'unknown' : gitCommitId
def gitCommitCountStr = 'git rev-list --count HEAD'.execute([], project.rootDir).text.trim()
def gitCommitCount = gitCommitCountStr.isEmpty() ? 1 : Integer.parseInt(gitCommitCountStr)
def baseVersionName = "0.09"
ext {
    versionCode = gitCommitCount
    versionName = "${baseVersionName}"
}